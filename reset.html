<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070b16" />
  <title>Orbit Foundry Reset</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f5f9ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 50% 20%, rgba(91,126,255,.22), transparent 26rem), #040711;
    }
    main {
      width: min(100%, 440px);
      padding: 26px;
      border: 1px solid rgba(157,205,255,.16);
      border-radius: 24px;
      background: rgba(12,20,36,.92);
      text-align: center;
    }
    .eyebrow { color: #71e8ff; font-size: 11px; font-weight: 900; letter-spacing: .16em; }
    h1 { margin: 8px 0 12px; font-size: 26px; }
    p { margin: 0; color: #9eb0c7; line-height: 1.55; }
    strong { color: #fff; }
    .done { margin-top: 18px; color: #78efba; font-weight: 800; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">LOCAL SAVE RESET</div>
    <h1>Orbit Foundry 초기화</h1>
    <p id="message">이 기기의 로컬 저장 데이터를 초기화하고 있습니다.</p>
    <p class="done" id="status">RESETTING…</p>
  </main>
  <script>
    (() => {
      try {
        localStorage.removeItem("orbit-foundry-save-v1");
        const extraKeys = [];
        for (let i = 0; i < localStorage.length; i += 1) {
          const key = localStorage.key(i);
          if (key && key.startsWith("orbit-foundry-save-") && key !== "orbit-foundry-save-v1") extraKeys.push(key);
        }
        extraKeys.forEach((key) => localStorage.removeItem(key));
        document.getElementById("status").textContent = "RESET COMPLETE";
        document.getElementById("message").innerHTML = "저장 데이터가 삭제되었습니다. <strong>수소부터 새 게임으로 시작합니다.</strong>";
      } catch (error) {
        document.getElementById("status").textContent = "RESET FAILED";
        document.getElementById("message").textContent = "브라우저 저장소를 초기화하지 못했습니다.";
        return;
      }
      window.setTimeout(() => {
        window.location.replace("./?fresh=1");
      }, 900);
    })();
  </script>
</body>
</html>
